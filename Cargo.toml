[package]
name = "imageguide-desktop"
version = "0.1.0"
edition = "2024"
description = "Audit and optimise a folder of images without uploading them anywhere"

[[bin]]
name = "imageguide"
path = "src/main.rs"

# gpui has no crates.io release, and gpui-component tracks zed's default branch with
# no revision of its own. Pinning one here would give cargo two different git sources
# for gpui and two incompatible copies of every type in it. Cargo.lock is what pins
# the actual commit; CI builds --locked.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
# The icon SVGs `IconName` refers to. Without an asset source registered on the
# application every icon resolves to nothing and renders as empty space.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
image = { version = "0.25", features = ["avif-native"] }
ravif = "0.13.0"
rgb = "0.8.53"
walkdir = "2"
webp = "0.3.1"
# Sirv REST sync. ureq keeps the dependency tree pure Rust (rustls), so no new
# system packages join the CI images; calls run on gpui's background executor.
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gpui's window backends are opt-in features, and only Linux has more than one.
# rfd's portal backend keeps GTK out of the build there; it does not exist on the
# other platforms, where rfd's defaults are already the native dialogs.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11", "font-kit"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17.2"

# gpui can render a frame to an image and hand back the pixels, but only with
# `test-support` on. That is how `cargo test --bin imageguide -- --ignored
# screenshot` gets a picture of the real window without needing the screen.
[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[profile.release]
opt-level = 2
