[package]
name = "imageguide-desktop"
version = "0.1.0"
edition = "2024"
description = "Audit and optimise a folder of images without uploading them anywhere"

[[bin]]
name = "imageguide"
path = "src/main.rs"

# gpui has no crates.io release. Pin the revision: the API changes without notice.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "7b48fc6822118a361b6094310cf5cbfc1a79c988" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7b48fc6822118a361b6094310cf5cbfc1a79c988" }
image = { version = "0.25", features = ["avif-native"] }
ravif = "0.13.0"
rgb = "0.8.53"
walkdir = "2"
webp = "0.3.1"

# gpui's window backends are opt-in features, and only Linux has more than one.
# rfd's portal backend keeps GTK out of the build there; it does not exist on the
# other platforms, where rfd's defaults are already the native dialogs.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7b48fc6822118a361b6094310cf5cbfc1a79c988", features = ["wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17.2"

[profile.release]
opt-level = 2
